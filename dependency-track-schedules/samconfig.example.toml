# Copy to samconfig.toml (gitignored). One profile per Inspector region.
# Batch-scan rules run only in the home region (where the syft scanner is).
#   home:   sam deploy
#   remote: sam deploy --config-env remote
version = 0.1

[default.deploy.parameters]
stack_name = "dependency-track-schedules"
region = "us-east-1"
capabilities = "CAPABILITY_NAMED_IAM"
resolve_s3 = true
confirm_changeset = false
fail_on_empty_changeset = false
parameter_overrides = "SyftScannerStackName=dependency-track-syft-scanner InspectorSbomStackName=dependency-track-inspector-sbom DeployBatchScanRules=true BatchScanOrg1=REPLACE_ME"

[remote.deploy.parameters]
stack_name = "dependency-track-schedules"
region = "us-east-2"
capabilities = "CAPABILITY_NAMED_IAM"
resolve_s3 = true
confirm_changeset = false
fail_on_empty_changeset = false
parameter_overrides = "InspectorSbomStackName=dependency-track-inspector-sbom DeployBatchScanRules=false"
